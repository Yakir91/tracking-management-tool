<!doctype html>
<html lang="he"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>מנהל מבחני גישוש</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Secular+One&family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
</head><body>
<style>
/* Layout: field-survey workbench — control panel on the reading side, map + timeline as the working surface. */
:root{
  --bg:#eff1e8; --surface:#fafbf6; --surface-2:#f3f5ec; --ink:#1c2118; --muted:#5b6553; --line:#d4d8c8;
  --accent:#de5510; --accent-ink:#ffffff; --accent-soft:#fbe4d6;
  --field:#e6e9d8; --grid:#cfd5bd; --ok:#2e7d3a; --warn:#a86a10; --bad:#c0392b; --chip:#e9ecdf;
  --f-display:'Secular One','Heebo','Arial Hebrew',sans-serif;
  --f-body:'IBM Plex Sans Hebrew','Heebo','Arial Hebrew',Arial,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141812; --surface:#1b2018; --surface-2:#20261c; --ink:#e6eadc; --muted:#9aa58e; --line:#323b2b;
  --accent:#ff7b36; --accent-ink:#1a0d04; --accent-soft:#3a2416;
  --field:#1f251b; --grid:#2e3727; --ok:#5fbf6c; --warn:#e0a640; --bad:#ef6a5a; --chip:#262d21; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141812; --surface:#1b2018; --surface-2:#20261c; --ink:#e6eadc; --muted:#9aa58e; --line:#323b2b;
  --accent:#ff7b36; --accent-ink:#1a0d04; --accent-soft:#3a2416;
  --field:#1f251b; --grid:#2e3727; --ok:#5fbf6c; --warn:#e0a640; --bad:#ef6a5a; --chip:#262d21; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
.app{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 28px;display:flex;flex-direction:column;gap:12px;max-width:1700px;margin:0 auto}
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.brand{display:flex;gap:12px;align-items:center}
.flag{width:14px;height:38px;position:relative;flex:none}
.flag::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--ink);border-radius:2px}
.flag::after{content:"";position:absolute;top:2px;left:3px;border-left:14px solid var(--accent);border-top:9px solid transparent;border-bottom:9px solid transparent;transform:scaleX(1)}
h1{font-family:var(--f-display);font-weight:400;font-size:1.65rem;margin:0;line-height:1.1;text-wrap:balance}
.sub{margin:2px 0 0;color:var(--muted);font-size:.82rem}
.top-ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.fld{display:flex;flex-direction:column;gap:2px;font-size:.75rem;color:var(--muted);letter-spacing:.02em}
.fld input,.fld select{font-size:.95rem;color:var(--ink)}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input[type=number]{width:5.5em}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:3px 8px;font-size:.82rem}
.btn.ghost{background:transparent}
.btn.live.on{background:var(--bad);border-color:var(--bad);color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.clock{font-family:var(--f-mono);font-size:1.1rem;font-variant-numeric:tabular-nums;min-width:4.5em}
.kpis{display:flex;flex-wrap:wrap;gap:6px 22px;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);align-items:baseline}
.kpi{display:flex;flex-direction:column;min-width:0}
.kpi b{font-family:var(--f-mono);font-size:1.15rem;font-variant-numeric:tabular-nums;font-weight:600}
.kpi span{font-size:.72rem;color:var(--muted);letter-spacing:.03em}
.kpis .warns{flex:1 1 280px;display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:.78rem;background:var(--chip);border:1px solid var(--line)}
.pill.warn{border-color:var(--warn);color:var(--warn)}
.pill.bad{border-color:var(--bad);color:var(--bad)}
.pill.ok{border-color:var(--ok);color:var(--ok)}
.main{display:grid;grid-template-columns:390px minmax(0,1fr);gap:12px;align-items:start}
@media (max-width:980px){.main{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0;display:flex;flex-direction:column}
.tabs{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--line);padding:4px 4px 0;gap:2px}
.tabs button{border:0;background:none;padding:8px 10px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;font-weight:500}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
.tabbody{padding:14px;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 210px);overflow:auto;min-width:0}
@media (max-width:980px){.tabbody{max-height:none}}
.tabbody h3{font-family:var(--f-display);font-weight:400;font-size:1.05rem;margin:0}
.tabbody h4{margin:0;font-size:.85rem;color:var(--muted);font-weight:600;letter-spacing:.03em}
.note{font-size:.82rem;color:var(--muted);margin:0}
.box{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:var(--surface-2)}
.box.ex{border-style:dashed;border-color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row>*{min-width:0}
.grid2{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center}
.grid2 label{font-size:.85rem}
table{border-collapse:collapse;width:100%;font-size:.85rem}
th,td{text-align:start;padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.72rem;color:var(--muted);font-weight:600;letter-spacing:.03em}
td.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tw{overflow-x:auto}
.lv{display:inline-flex;align-items:center;gap:5px;font-weight:600;white-space:nowrap}
.lv i{width:10px;height:10px;border-radius:2px;display:inline-block;flex:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 10px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.stage{display:flex;flex-direction:column;gap:12px;min-width:0}
.mapwrap{position:relative;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--field)}
#map{height:min(62vh,640px);min-height:360px;background:var(--field)}
.map-tools{position:absolute;top:10px;right:10px;z-index:900;display:flex;flex-wrap:wrap;gap:6px;max-width:calc(100% - 70px);justify-content:flex-end}
.map-tools .btn{box-shadow:0 1px 3px rgba(0,0,0,.18)}
.map-note{position:absolute;bottom:10px;right:10px;left:10px;z-index:900;background:var(--surface);border:1px solid var(--accent);border-radius:6px;padding:8px 12px;font-size:.85rem}
.legend{position:absolute;bottom:10px;right:10px;z-index:850;background:color-mix(in srgb,var(--surface) 90%,transparent);border:1px solid var(--line);border-radius:6px;padding:6px 10px;display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.75rem;max-width:calc(100% - 20px)}
.legend:empty{display:none}
.gantt-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.gantt-head{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);gap:10px;flex-wrap:wrap}
.gantt-head h2{font-family:var(--f-display);font-weight:400;font-size:1.05rem;margin:0}
.gantt{overflow:auto;max-height:520px;direction:ltr;position:relative}
.g-row{display:flex;height:26px;align-items:center;border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent);cursor:pointer}
.g-row:hover{background:var(--surface-2)}
.g-row.sel{background:var(--accent-soft)}
.g-bars{position:relative;height:100%;flex:none}
.g-lab{position:sticky;right:0;flex:none;width:210px;margin-left:auto;background:var(--surface);direction:rtl;padding:0 8px;font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:100%;display:flex;align-items:center;gap:6px;border-left:1px solid var(--line);z-index:2}
.g-row:hover .g-lab{background:var(--surface-2)}
.g-row.sel .g-lab{background:var(--accent-soft)}
.g-axis{display:flex;position:sticky;top:0;z-index:3;background:var(--surface);height:24px;border-bottom:1px solid var(--line)}
.g-axis .g-lab{font-weight:600;color:var(--muted)}
.tick{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);font-family:var(--f-mono);font-size:.68rem;color:var(--muted);padding-left:3px;line-height:24px}
.gl{position:absolute;top:0;bottom:0;border-left:1px dashed color-mix(in srgb,var(--line) 70%,transparent)}
.bar{position:absolute;top:6px;height:14px;border-radius:3px}
.bar.lay{opacity:.95}
.bar.age{height:4px;top:11px;opacity:.55}
.bar.jud{top:4px;height:18px;border:1.5px solid var(--ink)}
.bar.done{opacity:.4}
.xt{position:absolute;top:3px;width:3px;height:20px;background:var(--ink);border-radius:1px}
.nowline{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);z-index:1}
.card{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;background:var(--surface-2);display:flex;flex-direction:column;gap:6px}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.card pre{white-space:pre-wrap;font-family:var(--f-body);margin:0;font-size:.84rem;line-height:1.55}
.card .hd{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.ev{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:8px 0;border-bottom:1px solid var(--line);align-items:center}
.ev .t{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:600}
.ev .acts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ev.late .t{color:var(--bad)}
.ev input[type=time]{padding:3px 5px;font-size:.8rem}
.busy{position:fixed;inset:0;z-index:5000;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 70%,transparent);font-family:var(--f-display);font-size:1.3rem}
textarea{width:100%;min-height:90px;resize:vertical;font-family:var(--f-mono);font-size:.8rem}
.tag{font-size:.7rem;padding:1px 6px;border-radius:4px;background:var(--chip);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.order li{display:flex;gap:6px;align-items:center;padding:3px 0}
.order{list-style:none;margin:0;padding:0}
.src{font-size:.75rem;color:var(--muted)}
.src a{color:inherit}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Leaflet core (inlined, stylesheet hosts are restricted) */
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;direction:ltr;font-family:var(--f-body);-webkit-tap-highlight-color:transparent;outline-offset:1px}
.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow{user-select:none;-webkit-user-drag:none}
.leaflet-tile::selection{background:transparent}
.leaflet-container img.leaflet-tile,.leaflet-container .leaflet-marker-pane img,.leaflet-container .leaflet-tile-pane img,.leaflet-container img.leaflet-image-layer{max-width:none!important;max-height:none!important;width:auto;padding:0}
.leaflet-container .leaflet-overlay-pane svg{max-width:none!important;max-height:none!important}
.leaflet-container.leaflet-touch-zoom{touch-action:pan-x pan-y}
.leaflet-container.leaflet-touch-drag{touch-action:none}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom{touch-action:none}
.leaflet-tile{filter:inherit;visibility:hidden}
.leaflet-tile-loaded{visibility:inherit}
.leaflet-pane{z-index:400}
.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-shadow-pane{z-index:500}.leaflet-marker-pane{z-index:600}.leaflet-tooltip-pane{z-index:650}.leaflet-popup-pane{z-index:700}
.leaflet-map-pane canvas{z-index:100}.leaflet-map-pane svg{z-index:200}
.leaflet-control{position:relative;z-index:800;pointer-events:auto}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}
.leaflet-top{top:0}.leaflet-right{right:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}
.leaflet-control{float:left;clear:both}.leaflet-right .leaflet-control{float:right}
.leaflet-top .leaflet-control{margin-top:10px}.leaflet-bottom .leaflet-control{margin-bottom:10px}
.leaflet-left .leaflet-control{margin-left:10px}.leaflet-right .leaflet-control{margin-right:10px}
.leaflet-zoom-animated{transform-origin:0 0}

.leaflet-interactive{cursor:pointer}

.leaflet-bar{box-shadow:0 1px 5px rgba(0,0,0,.35);border-radius:4px}

.leaflet-container a.leaflet-popup-close-button{position:absolute;top:0;right:0;width:24px;height:24px;font:16px/24px var(--f-mono);color:var(--muted);text-decoration:none;text-align:center}

/* map icons */
.m-flag{display:flex;align-items:center;gap:2px;font:600 11px/1 var(--f-mono);color:#111;white-space:nowrap}
.m-flag span{background:#fff;border:2px solid currentColor;border-radius:4px;padding:2px 4px;color:#111}
.m-art{width:9px;height:9px;background:#fff;border:2px solid #111;transform:rotate(45deg)}

</style>

<div class="app" dir="rtl" lang="he">
  <header class="top">
    <div class="brand"><span class="flag" aria-hidden="true"></span>
      <div><h1>מנהל מבחני גישוש</h1><p class="sub">לפי תקנון FCI-IGP 2025 ותיקון ועדת כלבי העבודה מ-5.1.2026</p></div>
    </div>
    <div class="top-ctl">
      <label class="fld">תאריך המבחן<input type="date" id="s-date"></label>
      <label class="fld">תחילת הנחת עקבות<input type="time" id="s-start"></label>
      <button class="btn live" id="live-btn" type="button">הפעל מצב חי</button>
      <span class="clock" id="clock" aria-live="off"></span>

  <section class="kpis" id="kpis" aria-label="סיכום"></section>

      </div>
    </section>
  </div>
</div>

function renderMapTools(){const el=$('#maptools');if(!el)return;const m=state.map;let h='';

function estimateNeed(M){let a=0;const s=state.settings;for(const t of M.tracks){const g=t.geo;let w,hgt;if(g){const bb=bboxOf(g.pts);w=bb[2]-bb[0];hgt=bb[3]-bb[1];}else{const side=t.lv.paces*s.pace/ (t.lv.legs>3?3.2:2.2);w=hgt=side;}a+=(w+s.sep)*(hgt+s.sep)*0.75;}return Math.round(a/1000);}

function renderKPIs(M){const s=state.settings,k=$('#kpis');if(!M||!M.tracks.length){k.innerHTML='<span class="note">הוסיפו נבחנים כדי לבנות לו״ז.</span>';return;}
  const firstDog=Math.min(...M.tracks.map(t=>t.start));const warns=[];
  const J=Math.max(1,s.judges);for(let j=0;j<J;j++){const ph=M.tracks.filter(t=>t.judge===j).reduce((a,t)=>a+t.lv.phases,0);if(ph>36)warns.push(['bad',`שופט ${j+1}: ${ph} שלבים (מעל 36 ביום)`]);}
  const unplaced=M.tracks.filter(t=>!t.geo).length;if(unplaced)warns.push(['bad',`${unplaced} מסלולים בלי מיקום בשטח`]);
  const old=M.tracks.filter(t=>t.excess>45);if(old.length)warns.push(['warn',`${old.length} מסלולים ממתינים מעל 45 דק׳ אחרי ההשהייה`]);
  const blocked=M.tracks.filter(t=>t.approach&&t.approach.blocked).length;if(blocked)warns.push(['warn',`${blocked} נתיבי הליכה דורשים בדיקה`]);
  const noCross=M.tracks.filter(t=>t.lv.cross&&t.geo&&(!t.geo.cross||!t.geo.cross.length)).length;if(noCross)warns.push(['bad',`${noCross} מסלולים בלי עקבות חוצות`]);
  if(state.live){const pend=M.groups.filter(g=>!g.noDraw&&!g.draw&&g.firstStart-M.NOW<20).length;if(pend)warns.push(['warn',`${pend} קבוצות ממתינות להגרלה`]);}
  if(!warns.length)warns.push(['ok','כל הבדיקות עברו']);
  const avgEx=M.tracks.reduce((a,t)=>a+Math.max(0,t.excess),0)/M.tracks.length;
  k.innerHTML=`<div class="kpi"><b>${M.tracks.length}</b><span>נבחנים</span></div><div class="kpi"><b>${fmt(M.firstLay)}</b><span>הנחה ראשונה</span></div><div class="kpi"><b>${fmt(firstDog)}</b><span>כלב ראשון</span></div><div class="kpi"><b>${fmt(M.lastEnd)}</b><span>סיום משוער</span></div><div class="kpi"><b>${dur(M.lastEnd-M.firstLay)}</b><span>משך כולל</span></div><div class="kpi"><b>${Math.round(avgEx)} דק׳</b><span>המתנה ממוצעת מעבר להשהייה</span></div><div class="warns">${warns.map(([c,t])=>`<span class="pill ${c}">${t}</span>`).join('')}</div>`;}
function renderGantt(M){const el=$('#gantt');if(!M||!M.tracks.length){el.innerHTML='';return;}
  const z=state.ui.zoom,t0=Math.floor((Math.min(M.firstLay,...M.tracks.map(t=>(t.crossT||[{s:Infinity}])[0].s))-10)/30)*30,t1=Math.ceil((M.lastEnd+10)/30)*30;const W=(t1-t0)*z;const x=m=>(m-t0)*z;
  let ticks='';for(let m=t0;m<=t1;m+=30)ticks+=`<span class="tick" style="left:${x(m)}px">${fmt(m)}</span>`;
  let gl='';for(let m=t0;m<=t1;m+=30)gl+=`<span class="gl" style="left:${x(m)}px"></span>`;
  const nl=state.live&&M.NOW>t0&&M.NOW<t1?`<span class="nowline" style="left:${x(M.NOW)}px"></span>`:'';
  let h=`<div class="g-axis"><div class="g-bars" style="width:${W}px">${ticks}</div><div class="g-lab">מסלול · נבחן</div></div>`;
  for(const t of M.tracks.slice().sort((a,b)=>a.no-b.no)){const c=t.lv.color,a=t.act;
    const xs=(t.crossT||[]).map(cc=>`<span class="xt" style="left:${x(cc.e)}px" title="עקבה חוצה ${rng(cc.s,cc.e)}"></span>`).join('');
    h+=`<div class="g-row ${state.ui.sel===t.id?'sel':''}" data-act="sel" data-id="${t.id}"><div class="g-bars" style="width:${W}px">${gl}${nl}
      <span class="bar lay ${a.le!=null?'done':''}" style="left:${x(t.layStart)}px;width:${Math.max(2,(t.layEnd-t.layStart)*z)}px;background:${c}" title="הנחה ${rng(t.layStart,t.layEnd)}"></span>
      <span class="bar age" style="left:${x(t.layEnd)}px;width:${Math.max(0,(t.start-t.layEnd)*z)}px;background:${c}" title="גיל ${Math.round(t.age)} דק׳ (מינימום ${t.aging})"></span>
      <span class="bar jud ${a.je!=null?'done':''}" style="left:${x(t.start)}px;width:${Math.max(2,(t.end-t.start)*z)}px;background:color-mix(in srgb,${c} 55%,transparent)" title="עבודת הכלב ${rng(t.start,t.end)}"></span>${xs}</div>
      <div class="g-lab"><span class="lv"><i style="background:${c}"></i>${t.no}</span> <span class="mono">${fmt(t.start)}</span> ${esc(t.comp?t.comp.dog:('מקום '+(t.slot+1)))}</div></div>`;}
  el.innerHTML=h;}

function regen(){if(state.live){toast('במצב חי המסלולים לא מוצבים מחדש אוטומטית. לחצו "צור מסלולים מחדש" אם צריך.');recompute();return;}
  if(!state.map.field||state.map.field.length<3){recompute();return;}
  const bz=document.createElement('div');bz.className='busy';bz.textContent='מציב מסלולים בשטח…';document.body.appendChild(bz);
  setTimeout(()=>{try{generateTracks();}finally{bz.remove();}recompute();},30);}
let toastT=null;function toast(msg){mapNote(msg);clearTimeout(toastT);toastT=setTimeout(()=>{if(!tileFailed)mapNote(null);},7000);}
function recompute(){
  const M=buildModel();if(M.tracks.length){schedule(M);try{computeRoutes(M);}catch(e){console.error(e);}}else{M.NOW=nowMin();}
  lastM=M;renderKPIs(M);renderGantt(M);renderMap(M);renderPanel();renderTop();renderMapTools();}
function renderTop(){const s=state.settings;$('#s-date').value=s.date;$('#s-start').value=s.start;const b=$('#live-btn');b.classList.toggle('on',state.live);b.textContent=state.live?'מצב חי פעיל':'הפעל מצב חי';tick();}
function tick(){const d=new Date();$('#clock').textContent=pad(d.getHours())+':'+pad(d.getMinutes());}
function selectTrack(id,fromMap){state.ui.sel=state.ui.sel===id&&!fromMap?null:id;const t=lastM&&lastM.tracks.find(x=>x.id===id);
  if(t&&t.geo&&map&&state.ui.sel)map.fitBounds(L.latLngBounds(t.geo.pts.concat(t.geo.cross.flatMap(c=>[c.a,c.b])).map(toLL)),{padding:[40,40],maxZoom:map.getZoom()+2});
  if(fromMap&&state.ui.tab!=='cards'){state.ui.tab='cards';renderTabs();}
  renderMap(lastM);renderGantt(lastM);renderPanel();const card=t&&document.getElementById('card-'+t.no);if(card&&fromMap)card.scrollIntoView({block:'nearest'});}
async function copy(text){try{await navigator.clipboard.writeText(text);toast('הועתק.');}catch(e){const io=$('#io')||document.createElement('textarea');toast('ההעתקה נחסמה. סמנו את הטקסט ידנית.');}}
const strip=h=>h.replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&lt;/g,'<').replace(/&gt;/g,'>');

/* ===== events ===== */
document.addEventListener('click',async e=>{const el=e.target.closest('[data-act],[data-tab]');if(!el)return;
  if(el.dataset.tab){state.ui.tab=el.dataset.tab;renderTabs();renderPanel();save();return;}
  const a=el.dataset.act,id=el.dataset.id,s=state.settings;
  switch(a){
    case 'zoom':state.ui.zoom=Math.max(.8,Math.min(8,state.ui.zoom*(el.dataset.v==='1'?1.3:1/1.3)));renderGantt(lastM);save();break;
    case 'sel':selectTrack(id,false);break;
    case 'clear-ex':state.competitors=state.competitors.filter(c=>!c.example);state.draws={};save();regen();break;
    case 'add-comp':{const hN=$('#c-h').value.trim(),dN=$('#c-d').value.trim(),l=$('#c-l').value;if(!hN&&!dN){toast('הזינו שם מוביל או שם כלב.');return;}state.competitors.push({id:uid(),handler:hN,dog:dN,level:l});save();regen();$('#c-h')&&$('#c-h').focus();break;}
    case 'bulk':{const map2={FPR1:'FPR1',FPR2:'FPR2',FPR3:'FPR3',FH1:'IFH1',FH2:'IFH2',FH3:'IFH3',IFH1:'IFH1',IFH2:'IFH2',IFH3:'IFH3',IGP1:'FPR1',IGP2:'FPR2',IGP3:'FPR3'};let n=0,bad=0;
      $('#c-bulk').value.split('\n').map(x=>x.trim()).filter(Boolean).forEach(line=>{const p=line.split(/[,\t;]/).map(x=>x.trim());const code=(p[2]||'').toUpperCase().replace(/[\s\-]/g,'');const l=map2[code];if(!l){bad++;return;}state.competitors.push({id:uid(),handler:p[0]||'',dog:p[1]||'',level:l});n++;});
      save();regen();toast(`נוספו ${n} נבחנים${bad?`, ${bad} שורות לא זוהו (בדקו את שם הרמה)`:''}.`);break;}
    case 'del-comp':state.competitors=state.competitors.filter(c=>c.id!==id);save();regen();break;
    case 'mode':if(state.map.mode!==el.dataset.v){state.map.mode=el.dataset.v;confirmSwap();save();initMap();recompute();if(el.dataset.v==='satellite'){state.ui.tab='field';renderTabs();renderPanel();}}break;
    case 'field-draw':drawMode='field';drawPts=[];renderPanel();renderMap(lastM);renderMapTools();break;
    case 'path-draw':drawMode='path';drawPts=[];renderPanel();renderMap(lastM);renderMapTools();break;
    case 'path-done':finishPath();break;
    case 'path-clear':state.map.path=[];state.geo={};save();recompute();break;
    case 'layer':state.ui.layer=el.dataset.v;save();{const c=map.getCenter(),z=map.getZoom();initMap();map.setView(c,z);renderMap(lastM);}break;
    case 'search':{const q=$('#q-in').value.trim();if(!q)break;const ll=q.split(/[ ,]+/).map(Number);if(ll.length===2&&ll.every(x=>!isNaN(x))){map.setView(ll,16);break;}
      const out=$('#q-res');out.innerHTML='<span class="note">מחפש…</span>';
      try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=6&accept-language=he&countrycodes=il&q='+encodeURIComponent(q));const js=await r.json();
        out.innerHTML=js.length?js.map((x,i)=>`<button class="btn sm" type="button" data-act="goto-res" data-lat="${x.lat}" data-lon="${x.lon}">${esc(x.display_name.split(',').slice(0,3).join(','))}</button>`).join(''):'<span class="note">לא נמצאו תוצאות.</span>';}
      catch(err){out.innerHTML='<span class="note">החיפוש לא זמין בתצוגה הזו. הזינו קואורדינטות, למשל 31.84, 34.80.</span>';}break;}
    case 'goto-res':map.setView([+el.dataset.lat,+el.dataset.lon],16);break;
    case 'myloc':try{navigator.geolocation.getCurrentPosition(pos=>map.setView([pos.coords.latitude,pos.coords.longitude],17),()=>toast('לא התקבל מיקום. אשרו גישה למיקום או חפשו את המקום.'));}catch(err){toast('המיקום לא זמין בתצוגה הזו.');}break;
    case 'field-done':finishField();break;
    case 'field-cancel':drawMode=null;drawPts=[];renderPanel();renderMap(lastM);renderMapTools();break;
    case 'base':drawMode='base';renderPanel();renderMapTools();break;
    case 'gen':regen();break;
    case 'routes':state.ui.showRoutes=el.checked;save();renderMap(lastM);break;
    case 'calib':drawMode='calib';calibPts=[];renderPanel();break;
    case 'calib-cancel':calibPts=[];drawMode=null;renderPanel();renderMap(lastM);break;
    case 'calib-ok':{const real=+$('#calib-d').value;const meas=dist(calibPts[0],calibPts[1]);if(real>0&&meas>0){const k=real/meas;const m=state.map;m.image.scale*=k;m.field=m.field.map(p=>[p[0]*k,p[1]*k]);m.path=(m.path||[]).map(p=>[p[0]*k,p[1]*k]);m.base=[m.base[0]*k,m.base[1]*k];state.geo={};state.trackNo={};}
      calibPts=[];save();initMap();recompute();toast('קנה המידה עודכן. סמנו את השטח וצרו מסלולים.');break;}
    case 'goto-old':{const v=$('#ll-in').value.split(/[ ,]+/).map(Number).filter(x=>!isNaN(x));if(v.length===2){state.map.origin=v;state.map.field=[];state.map.base=[0,-80];state.geo={};save();initMap();recompute();}else toast('הזינו קו רוחב וקו אורך, לדוגמה 31.62, 34.83');break;}
    case 'gsize':s.groupSize=+el.dataset.v;save();regen();break;
    case 'gjudge':break;
    case 'draw':{const g=lastM.groups.find(x=>x.id===id);state.draws[id]={sig:g.sig,order:shuffle(g.members),at:Date.now()};save();recompute();break;}
    case 'undraw':delete state.draws[id];save();recompute();break;
    case 'copy-sched':{const ev=events(lastM).filter(x=>x.kind==='judge');copy(`לו״ז יציאות, מבחן גישוש ${s.date}\n`+ev.map(x=>fmt(x.t)+'  '+x.plain).join('\n'));break;}
    case 'copy-full':copy(`לו״ז מלא, מבחן גישוש ${s.date}\n`+events(lastM).map(x=>fmt(x.t)+'  '+strip(x.txt)+' · '+x.who).join('\n'));break;
    case 'copy-card':{const t=lastM.tracks.find(x=>x.id===id);copy(trackCard(t));break;}
    case 'copy-all-cards':copy(lastM.tracks.slice().sort((a,b)=>a.no-b.no).map(trackCard).join('\n\n———\n\n'));break;
    case 'live':state.live=!state.live;save();recompute();if(state.live){state.ui.tab='live';renderTabs();renderPanel();}break;
    case 'mark':{const inp=document.getElementById('tm-'+el.dataset.key);const tm=inp&&inp.value?hm(inp.value):Math.round(nowMin()*10)/10;const t=lastM.tracks.find(x=>x.id===id);const ac=state.actuals[id]=state.actuals[id]||{};
      if(el.dataset.k==='ls')ac.res=t.res;ac[el.dataset.k]=tm;if(el.dataset.k==='le'&&ac.ls==null)ac.ls=tm-t.layDur;save();recompute();break;}
    case 'unmark':{const ac=state.actuals[id];if(ac){delete ac[el.dataset.k];if(el.dataset.k==='ls'){delete ac.le;delete ac.res;}}save();recompute();break;}
    case 'reset-actuals':state.actuals={};save();recompute();break;
    case 'ord':{const i=+el.dataset.v,d=+el.dataset.d,o=s.levelOrder;[o[i],o[i+d]]=[o[i+d],o[i]];s.autoOrder=false;save();regen();break;}
    case 'autoorder':s.autoOrder=el.checked;save();if(s.autoOrder){save();regen();}else renderPanel();break;
    case 'export':copy(JSON.stringify(state));break;
    case 'import':{try{const v=JSON.parse($('#io').value);if(!v.settings)throw 0;state=v;const d=defaultState();state.ui=Object.assign(d.ui,state.ui||{});['draws','geo','trackNo','actuals','judgeOverride'].forEach(k=>state[k]=state[k]||{});save();initMap();recompute();toast('הגיבוי נטען.');}catch(err){toast('הטקסט בתיבה אינו גיבוי תקין של המערכת.');}break;}
    case 'reset':if(el.dataset.armed){state=defaultState();save();initMap();generateTracks();recompute();}else{el.dataset.armed='1';el.textContent='לחצו שוב לאישור';setTimeout(()=>{if(el.isConnected){delete el.dataset.armed;el.textContent='התחל מאפס';}},4000);}break;
  }
});
function confirmSwap(){const m=state.map;m.field=[];m.path=[];state.geo={};state.trackNo={};
  if(m.mode==='satellite'){m.base=[0,0];toast('חפשו את המקום, סמנו את שטח המסלולים ואת שביל הגישה, ולחצו "צור מסלולים".');}
  if(m.mode==='image'){m.base=[0,0];if(!m.image)toast('העלו תמונת אוויר של השטח בלשונית "שטח ומפה".');}
  if(m.mode==='schematic'){const d=defaultState().map;m.field=d.field;m.path=d.path;m.base=d.base;}return true;}
document.addEventListener('change',e=>{const el=e.target;const s=state.settings;
  if(el.id==='s-date'){s.date=el.value||todayISO();save();recompute();return;}
  if(el.id==='s-start'){s.start=el.value||'07:00';save();recompute();return;}
  if(el.dataset.set){let v=+el.value;if(isNaN(v))return;v=Math.max(+el.min||0,v);s[el.dataset.set]=v;if(['pace','intraSep','semiR','crossExt','sep','edge','crossClear','setback','walkBuf'].includes(el.dataset.set)){save();regen();return;}save();recompute();return;}
  if(el.dataset.aging){s.aging[el.dataset.aging]=Math.max(LEVELS[el.dataset.aging].aging,+el.value||0);save();regen();return;}
  if(el.dataset.est){s.est[el.dataset.est]=Math.min(LEVELS[el.dataset.est].work,Math.max(3,+el.value||3));save();regen();return;}
  if(el.dataset.act==='comp-level'){const c=state.competitors.find(x=>x.id===el.dataset.id);if(c)c.level=el.value;save();regen();return;}
  if(el.dataset.act==='gjudge'){state.judgeOverride[el.dataset.id]=+el.value;save();recompute();return;}
  if(el.id==='img-in'&&el.files[0]){const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{state.map.image={url:fr.result,w:im.naturalWidth,h:im.naturalHeight,scale:1};imgVolatile=fr.result;state.map.field=[];state.map.path=[];state.map.base=[im.naturalWidth*0.05,im.naturalHeight*0.05];state.geo={};save();initMap();recompute();toast('התמונה נטענה. עכשיו כיילו קנה מידה: "כיול קנה מידה" ושתי נקודות עם מרחק ידוע.');};im.src=fr.result;};fr.readAsDataURL(el.files[0]);}
});
$('#live-btn').addEventListener('click',()=>{});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.target.id==='c-h'||e.target.id==='c-d')){e.preventDefault();document.querySelector('[data-act=add-comp]').click();}if(e.key==='Escape'&&drawMode){drawMode=null;drawPts=[];calibPts=[];renderPanel();renderMap(lastM);renderMapTools();}});
$('#live-btn').dataset.act='live';
setInterval(()=>{tick();if(state.live)recompute();},30000);

/* ===== boot ===== */
if(!state.map.path)state.map.path=[];if(state.settings.setback==null)state.settings.setback=12;if(state.settings.autoOrder==null)state.settings.autoOrder=true;
renderTabs();initMap();probeTiles();
{const M0=buildModel();if(state.map.field&&state.map.field.length>2&&M0.tracks.length&&M0.tracks.some(t=>!t.geo||t.geo.level!==t.level))generateTracks();}
recompute();
window.__ttm={state:()=>state,model:()=>lastM,generateTracks,recompute};
})();
</script>
